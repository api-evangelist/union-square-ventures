aid: union-square-ventures
name: Union Square Ventures
description: >-
  Union Square Ventures (USV) is a thesis-driven, early-stage venture capital
  firm founded in 2003 by Fred Wilson and Brad Burnham and headquartered at 817
  Broadway in New York City. USV invests at the edge of large markets being
  transformed by technological and societal pressures, historically backing
  large networks of engaged users that are differentiated through user
  experience and defensible through network effects, and more recently companies
  that broaden access to knowledge, capital, and well-being. The firm invests
  primarily at Seed and Series A across three strategies — a Core fund, a
  Climate fund, and an Opportunity (later-stage) fund — with check sizes
  typically ranging from roughly $1M at seed to the low-to-mid single-digit
  millions at Series A. USV runs a small, collegial partnership and focuses on
  social media, marketplaces, developer tools, learning/education, health,
  fintech, web3/decentralized protocols, energy, and climate. It reports roughly
  $1.9B in assets under management across 14 funds. Notable investments include
  Twitter, Etsy, Coinbase, Stripe, Cloudflare, MongoDB, Twilio, Duolingo,
  Kickstarter, Stack Overflow, SoundCloud, and Carta.
